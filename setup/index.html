<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Bot Setup Form</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:auto;padding:16px;background:#f4f7f6}h1{color:#075e54;font-size:22px}label{display:block;margin-top:12px;font-weight:600}input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:24px;background:#25d366;color:#fff;font-size:16px}small{color:#666}</style></head><body>
<h1>🦷 Your Clinic WhatsApp Bot: Setup Form</h1><p>Takes 3 minutes. We'll set up your bot within 48 hours.</p>
<form id="f">
<label>Clinic name<input name="Clinic" required></label>
<label>Doctor's name<input name="Doctor" required></label>
<label>Address + Google Maps link<textarea name="Address" rows="2" required></textarea></label>
<label>Clinic timings<input name="Timings" placeholder="Mon–Sat 10 AM–8 PM" required></label>
<label>Treatments offered<textarea name="Treatments" rows="2" placeholder="Check-up, Cleaning, RCT, Braces, Implants"></textarea></label>
<label>Slot length (minutes)<input name="Slot" value="30"></label>
<label>WhatsApp number for the bot<input name="BotNumber" required><small>Must be a number not on the normal WhatsApp app (or that you'll move to the bot).</small></label>
<label>Staff number to receive handovers<input name="StaffNumber"></label>
<label>Google review link<input name="ReviewLink"></label>
<label>Languages<input name="Languages" value="Bengali, English"></label>
<label>Plan<input name="Plan" value="Diwali pilot ₹4,999"></label>
<label>UPI payment reference (if paid)<input name="UPIref"></label>
<button>Send details on WhatsApp</button></form>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();let t="New clinic bot setup:\n";new FormData(e.target).forEach((v,k)=>t+=k+": "+v+"\n");location.href="https://wa.me/917005591395?text="+encodeURIComponent(t)}</script></body></html>
